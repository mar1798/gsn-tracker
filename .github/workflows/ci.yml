name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # API integration tests run against a real Postgres (database gsc_test is recreated).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gsc
          POSTGRES_PASSWORD: gsc
          POSTGRES_DB: gsc
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gsc -d gsc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
