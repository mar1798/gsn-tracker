    <g fill="#D6F45B">
      <rect x="165" y="362" width="70" height="300" rx="35" opacity="0.55"/>
      <rect x="255" y="282" width="90" height="460" rx="45"/>
      <rect x="679" y="282" width="90" height="460" rx="45"/>
      <rect x="789" y="362" width="70" height="300" rx="35" opacity="0.55"/>
