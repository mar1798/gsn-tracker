services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gsc}
      POSTGRES_DB: ${POSTGRES_DB:-gsc}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for raw FIT files (MinIO stopped publishing public images).
  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: >
      /bin/sh -c "
      printf '{\"identities\":[{\"name\":\"gsc\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\" > /tmp/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gsc-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gsc-s3-secret}
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data

  # Creates the FIT bucket once storage is up.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket $${S3_BUCKET} 2>/dev/null && exit 0;
        aws --endpoint-url http://s3:8333 s3 mb s3://$${S3_BUCKET} && exit 0;
        sleep 2;
      done; exit 1
      "
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-gsc-s3}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-gsc-s3-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-gsc-fit-files}

  # Optional: `docker compose --profile full up` runs the API in a container too.
  # For day-to-day work use `pnpm dev` (API on the host with hot reload).
  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gsc}:${POSTGRES_PASSWORD:-gsc}@postgres:5432/${POSTGRES_DB:-gsc}
      S3_ENDPOINT: http://s3:8333
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  s3-data:
